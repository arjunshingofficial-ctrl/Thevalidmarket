<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" rx="16" fill="#FFFFFF"/>
  <rect x="0" y="0" width="320" height="180" rx="16" fill="none" stroke="#E2E8F0" stroke-width="4"/>
  <g transform="translate(60, 45)">
    <!-- Red band -->
    <rect x="0" y="0" width="60" height="90" rx="10" fill="#DA251D" transform="skewX(-10)"/>
    <!-- Blue band -->
    <rect x="68" y="0" width="60" height="90" rx="10" fill="#005B9C" transform="skewX(-10)"/>
    <!-- Green band -->
    <rect x="136" y="0" width="60" height="90" rx="10" fill="#008064" transform="skewX(-10)"/>
    <text x="16" y="60" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF">UnionPay</text>
    <text x="60" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#E2E8F0">银联</text>
  </g>
</svg>